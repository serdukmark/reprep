# Run from repository root: docker compose -f infra/vm/compose.yaml ...
name: reprep
services:
  app:
    image: reprep:${REPREP_RELEASE:?Set unique release ID}
    build:
      context: ../..
    env_file: ../../.env
    environment:
      DATABASE_PATH: /app/data/reprep.sqlite3
      # APP_ENV, DEMO_ENABLED, AI_SYNTHETIC_ONLY and AI_DATA_APPROVED come from .env.
      # vm_apply writes production without demo unless the release .env already sets them;
      # the code refuses demo accounts outside APP_ENV=demo and defaults AI to synthetic-only.
    ports:
      - '127.0.0.1:${REPREP_BIND_PORT:?Verify a free VM port and set REPREP_BIND_PORT}:8000'
    volumes:
      - data:/app/data
      - ../../max-ca.pem:/run/reprep-max-ca.pem:ro
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  data:
