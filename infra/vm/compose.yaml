# Run from repository root: docker compose -f infra/vm/compose.yaml ...
name: reprep
services:
  app:
    build:
      context: ../..
    env_file: ../../.env
    environment:
      DATABASE_PATH: /app/data/reprep.sqlite3
      APP_ENV: production
      DEMO_ENABLED: 'false'
      AI_SYNTHETIC_ONLY: 'true'
    ports:
      - '127.0.0.1:${REPREP_BIND_PORT:?Verify a free VM port and set REPREP_BIND_PORT}:8000'
    volumes:
      - data:/app/data
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  data:
