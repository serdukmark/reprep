# DATA-API 1.0 — reprep
# Format: https://gitverse.ru/stasnorman/example-data-api (template, JSON Schema, validator).
# No passwords, tokens or keys here. The checks sign in through the public demo
# endpoints of the judging stand: demo accounts are synthetic and marked "демо".

schemaVersion: "1.0"

solution:
  name: "reprep — платформа для репетиторов и учеников в MAX"

api:
  baseUrl: "https://reprep.ru"
  openapi: "./openapi.json"
  defaultHeaders:
    Accept: "application/json"

checks:
  - id: "health"
    name: "Процесс API отвечает"
    method: "GET"
    path: "/api/health"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["status"]
    timeoutMs: 5000
    repeatable: true

  - id: "ready"
    name: "База данных доступна"
    method: "GET"
    path: "/api/ready"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["ready"]
    timeoutMs: 5000
    repeatable: true

  - id: "tutor-login"
    name: "Вход демо-репетитора"
    description: "Синтетический демо-аккаунт стенда. Возвращает сессионный токен; вход через MAX для настоящих пользователей идёт через POST /api/auth/max с подписанным init_data."
    method: "POST"
    path: "/api/auth/demo/{persona}"
    role: "public"
    request:
      path:
        persona: "tutor"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["token", "user"]
    timeoutMs: 5000
    repeatable: true
    extract:
      tutorToken: "$.token"

  - id: "learner-login"
    name: "Вход демо-ученика"
    description: "Второй синтетический ученик (Женя • демо): автоматические проверки не засоряют ученика, под которым заходит жюри."
    method: "POST"
    path: "/api/auth/demo/{persona}"
    role: "public"
    request:
      path:
        persona: "learner-2"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["token", "user"]
    timeoutMs: 5000
    repeatable: true
    extract:
      learnerToken: "$.token"

  - id: "tutor-learners"
    name: "Репетитор видит своих учеников"
    method: "GET"
    path: "/api/relationships"
    role: "tutor"
    dependsOn: ["tutor-login"]
    request:
      headers:
        Authorization: "Bearer ${tutorToken}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: true

  - id: "create-assignment"
    name: "Репетитор создаёт задание ученику"
    description: "Черновик задания для демо-ученика (связь demo-link-2). Удаления в API нет: объект остаётся в демо-пространстве, которое сбрасывается кнопкой «Восстановить демо»."
    method: "POST"
    path: "/api/assignments"
    role: "tutor"
    dependsOn: ["tutor-login"]
    request:
      headers:
        Authorization: "Bearer ${tutorToken}"
        Content-Type: "application/json"
      body:
        relationship_id: "demo-link-2"
        title: "Проверка DATA-API: сложение"
        instructions: "Автоматическая проверка API на синтетических данных."
        tasks:
          - id: "sum"
            type: "numeric"
            prompt: "Сколько будет 2 + 3?"
            answer: "5"
            skill: "Сложение"
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields: ["id", "status", "tasks"]
    timeoutMs: 5000
    repeatable: false
    extract:
      assignmentId: "$.id"

  - id: "publish-assignment"
    name: "Репетитор выдаёт задание"
    method: "POST"
    path: "/api/assignments/{id_}/publish"
    role: "tutor"
    dependsOn: ["create-assignment"]
    request:
      path:
        id_: "${assignmentId}"
      headers:
        Authorization: "Bearer ${tutorToken}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: false

  - id: "learner-opens-assignment"
    name: "Ученик открывает задание без эталонных ответов"
    method: "GET"
    path: "/api/assignments/{id_}"
    role: "learner"
    dependsOn: ["publish-assignment", "learner-login"]
    request:
      path:
        id_: "${assignmentId}"
      headers:
        Authorization: "Bearer ${learnerToken}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "title", "tasks"]
    timeoutMs: 5000
    repeatable: true

  - id: "learner-submits"
    name: "Ученик сдаёт работу на проверку"
    description: "Сдача ставит работу в очередь предварительного AI-разбора; решение по ней принимает репетитор."
    method: "POST"
    path: "/api/assignments/{id_}/submit"
    role: "learner"
    dependsOn: ["learner-opens-assignment"]
    request:
      path:
        id_: "${assignmentId}"
      headers:
        Authorization: "Bearer ${learnerToken}"
        Content-Type: "application/json"
      body:
        revision: 0
        answers:
          sum: "5"
    expected:
      statusCodes: [200]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: false

  - id: "tutor-sees-submission"
    name: "Репетитор видит сданную работу"
    method: "GET"
    path: "/api/assignments/{id_}"
    role: "tutor"
    dependsOn: ["learner-submits"]
    request:
      path:
        id_: "${assignmentId}"
      headers:
        Authorization: "Bearer ${tutorToken}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "submission"]
    timeoutMs: 5000
    repeatable: true

  - id: "learner-progress"
    name: "Ученик видит прогресс по навыкам"
    method: "GET"
    path: "/api/relationships/{id_}/progress"
    role: "learner"
    dependsOn: ["learner-login"]
    request:
      path:
        id_: "demo-link-2"
      headers:
        Authorization: "Bearer ${learnerToken}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: true
