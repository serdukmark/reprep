name: Local contracts and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: python -m pytest -q
      - run: python scripts/test_failure_mutations.py
      - run: python scripts/test_question_mutations.py
      - run: python scripts/test_generation_mutations.py
      - run: python scripts/test_answer_file_mutations.py
      - run: python scripts/test_guardian_mutations.py
      - run: python scripts/test_workspace_mutations.py
      - run: python scripts/test_marketplace_mutations.py
      - run: python scripts/test_skill_graph_mutations.py
      - run: python scripts/check_secrets.py
      - run: npm run build
